<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#3b82f6">
    <meta name="description" content="Tạo trang bio cá nhân miễn phí.">
    <title>MyBio - Tạo trang cá nhân của bạn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            overflow-x: hidden;
        }
        input, textarea, select { font-size: 16px; }
        @media (min-width: 768px) { input, textarea, select { font-size: 14px; } }

        .glass {
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            border-bottom: 1px solid rgba(255,255,255,0.3);
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes toastIn { from { opacity: 0; transform: translateY(-20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes toastOut { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(-20px) scale(0.95); } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .animate-fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }
        .animate-float { animation: float 4s ease-in-out infinite; }

        .loader {
            border: 3px solid #f3f3f3; border-radius: 50%;
            border-top: 3px solid #3b82f6; width: 24px; height: 24px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .bg-animated {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 18s ease infinite;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .btn-loading { position: relative; color: transparent !important; pointer-events: none; }
        .btn-loading::after {
            content: ""; position: absolute; width: 16px; height: 16px;
            top: 50%; left: 50%; margin: -8px 0 0 -8px;
            border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff;
            border-radius: 50%; animation: spin 0.7s linear infinite;
        }

        @media (min-width: 1024px) {
            .sticky-preview { position: sticky; top: 96px; }
        }

        /* ===== TOAST FIX ===== */
        .toast-item {
            animation: toastIn 0.3s ease-out forwards;
            word-break: break-word;
            overflow-wrap: anywhere;
            line-height: 1.4;
            max-height: 40vh;
            overflow-y: auto;
        }
        .toast-item.closing {
            animation: toastOut 0.25s ease-in forwards;
        }
        .toast-item::-webkit-scrollbar { width: 4px; }
        .toast-item::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.4); border-radius: 2px; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @media (hover: hover) {
            .hover-lift:hover { transform: translateY(-2px); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col transition-colors duration-300">

    <!-- Navigation -->
    <nav class="fixed top-0 w-full glass z-50" id="navbar">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-14 md:h-16">
                <div class="flex-shrink-0 flex items-center cursor-pointer select-none" onclick="window.location.hash = ''">
                    <i class="fa-solid fa-link text-blue-600 text-xl md:text-2xl mr-2"></i>
                    <span class="font-bold text-lg md:text-xl tracking-tight">MyBio</span>
                </div>
                <div class="flex items-center space-x-2 md:space-x-4" id="nav-actions"></div>
            </div>
        </div>
    </nav>

    <!-- Toast Container: FIX vị trí + kích thước -->
    <div id="toast-container"
         class="fixed top-20 left-4 right-4 md:top-auto md:bottom-6 md:right-6 md:left-auto z-[60] flex flex-col gap-2 items-stretch md:items-end pointer-events-none">
    </div>

    <!-- Global Loader -->
    <div id="global-loader" class="fixed inset-0 bg-white/80 backdrop-blur-sm z-[70] flex flex-col justify-center items-center transition-opacity duration-300">
        <div class="loader mb-4" style="width: 50px; height: 50px; border-width: 5px;"></div>
        <p class="text-gray-600 font-medium text-sm">Đang tải dữ liệu...</p>
    </div>

    <!-- Main Content -->
    <main class="flex-grow pt-14 md:pt-16 flex flex-col" id="main-content"></main>

    <!-- Mobile Preview Modal -->
    <div id="mobile-preview-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[65] hidden items-center justify-center p-4">
        <div class="bg-gray-900 rounded-[2.5rem] p-2 shadow-2xl w-full max-w-[340px] aspect-[9/19] border-8 border-gray-900 relative">
            <div class="absolute top-0 inset-x-0 h-6 bg-gray-900 rounded-b-xl w-32 mx-auto z-20"></div>
            <button onclick="closeMobilePreview()" class="absolute -top-12 right-0 text-white text-2xl w-10 h-10 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center z-30">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="bg-gray-100 w-full h-full rounded-[2rem] overflow-hidden overflow-y-auto no-scrollbar pb-10" id="mobile-preview-area"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        // ⚡ Dùng initializeFirestore để bật Long Polling
        import {
            initializeFirestore,
            doc, getDoc, setDoc, updateDoc, onSnapshot, collection, getDocs, query, where
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ===== FIREBASE CONFIG =====
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'mybio-default-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyCpCQdTzBTFDbD0kIa4vdI7KJDmW1-1jaE",
            authDomain: "mybio-app-7eac2.firebaseapp.com",
            projectId: "mybio-app-7eac2",
            storageBucket: "mybio-app-7eac2.firebasestorage.app",
            messagingSenderId: "135599269837",
            appId: "1:135599269837:web:fddff5d3451debfe1fc684"
        };

        const app = initializeApp(firebaseConfig);

        // ⚡⚡⚡ FIX CHÍNH: Bật Long Polling để tránh lỗi "client is offline"
        const db = initializeFirestore(app, {
            experimentalForceLongPolling: true,
            experimentalAutoDetectLongPolling: true,
            useFetchStreams: false
        });

        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        let currentUser = null;
        let userBioCache = null;
        let currentBioUnsubscribe = null;
        let tempThumbnailBase64 = null;

        const biosCollectionPath = `artifacts/${appId}/public/data/bios`;

        // ===== DỊCH LỖI FIREBASE SANG TIẾNG VIỆT =====
        function friendlyError(err) {
            if (!err) return "Đã xảy ra lỗi không xác định.";
            const code = err.code || '';
            const msg = (err.message || '').toLowerCase();

            // Ưu tiên check code
            if (code === 'unavailable' || msg.includes('client is offline') || msg.includes('offline')) {
                return "Không kết nối được máy chủ. Vui lòng kiểm tra mạng và tải lại trang.";
            }
            if (code === 'permission-denied' || msg.includes('permission')) {
                return "Bạn không có quyền truy cập. Vui lòng kiểm tra lại đăng nhập.";
            }
            if (code === 'unauthenticated' || msg.includes('unauthenticated')) {
                return "Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.";
            }
            if (code === 'not-found' || msg.includes('not-found')) {
                return "Không tìm thấy dữ liệu.";
            }
            if (code === 'already-exists' || msg.includes('already exists')) {
                return "Dữ liệu đã tồn tại.";
            }
            if (code === 'resource-exhausted' || msg.includes('quota')) {
                return "Đã vượt giới hạn. Vui lòng thử lại sau.";
            }
            if (code === 'auth/popup-blocked') {
                return "Cửa sổ đăng nhập bị chặn. Vui lòng cho phép Popup.";
            }
            if (code === 'auth/popup-closed-by-user') {
                return "Bạn đã đóng cửa sổ đăng nhập.";
            }
            if (code === 'auth/unauthorized-domain') {
                return "Tên miền chưa được cấp phép. Vui lòng thêm vào Firebase Authorized Domains.";
            }
            if (code === 'auth/network-request-failed') {
                return "Lỗi mạng khi đăng nhập. Vui lòng thử lại.";
            }
            if (code === 'auth/cancelled-popup-request') {
                return "Đã có cửa sổ đăng nhập khác đang mở.";
            }
            // Fallback: cắt ngắn message gốc
            return "Có lỗi xảy ra. Vui lòng thử lại.";
        }

        // ===== UTILITIES =====
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        }
        function safeUrl(url) {
            if (!url) return '#';
            try {
                const u = new URL(url);
                if (u.protocol === 'http:' || u.protocol === 'https:') return u.href;
            } catch (e) {}
            return '#';
        }

        // ===== TOAST FIX =====
        window.showToast = function(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');

            let bgClass = 'bg-gray-800', icon = 'fa-circle-info';
            if (type === 'success') { bgClass = 'bg-green-600'; icon = 'fa-check-circle'; }
            if (type === 'error')   { bgClass = 'bg-red-600';   icon = 'fa-exclamation-circle'; }
            if (type === 'warning') { bgClass = 'bg-amber-500'; icon = 'fa-triangle-exclamation'; }

            toast.className = `toast-item pointer-events-auto ${bgClass} text-white px-4 py-3 rounded-xl shadow-lg flex items-start gap-3 w-full md:w-auto md:min-w-[280px] md:max-w-[380px] text-sm`;
            toast.innerHTML = `
                <i class="fa-solid ${icon} flex-shrink-0 mt-0.5"></i>
                <span class="flex-1 break-words">${escapeHtml(message)}</span>
                <button class="text-white/70 hover:text-white flex-shrink-0 ml-1 -mr-1" aria-label="Đóng">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            `;

            const closeBtn = toast.querySelector('button');
            const removeToast = () => {
                toast.classList.add('closing');
                setTimeout(() => toast.remove(), 250);
            };
            closeBtn.addEventListener('click', removeToast);

            container.appendChild(toast);

            const timeout = setTimeout(removeToast, type === 'error' ? 6000 : 3500);
            toast.addEventListener('mouseenter', () => clearTimeout(timeout));
        };

        function hideLoader() {
            const l = document.getElementById('global-loader');
            l.style.opacity = '0';
            setTimeout(() => l.style.display = 'none', 300);
        }
        function showLoader() {
            const l = document.getElementById('global-loader');
            l.style.display = 'flex';
            setTimeout(() => l.style.opacity = '1', 10);
        }
        function setBtnLoading(btn, loading) {
            if (!btn) return;
            if (loading) { btn.dataset.originalText = btn.innerHTML; btn.classList.add('btn-loading'); btn.disabled = true; }
            else { btn.innerHTML = btn.dataset.originalText || btn.innerHTML; btn.classList.remove('btn-loading'); btn.disabled = false; }
        }
        function compressImage(file, maxSize = 300, quality = 0.75) {
            return new Promise((resolve, reject) => {
                if (!file.type.match(/image.*/)) return reject(new Error("File không phải là ảnh."));
                if (file.size > 5 * 1024 * 1024) return reject(new Error("Ảnh quá lớn (tối đa 5MB)."));
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const minSize = Math.min(img.width, img.height);
                        const sx = (img.width - minSize) / 2;
                        const sy = (img.height - minSize) / 2;
                        canvas.width = maxSize; canvas.height = maxSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, sx, sy, minSize, minSize, 0, 0, maxSize, maxSize);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = () => reject(new Error("Không đọc được ảnh."));
                    img.src = e.target.result;
                };
                reader.onerror = () => reject(new Error("Lỗi đọc file."));
                reader.readAsDataURL(file);
            });
        }

        // ===== AUTH =====
        async function initAuth() {
            try {
                await signInAnonymously(auth);
            } catch (e) {
                console.error("Auth error:", e);
                // Không hiện toast ở đây để tránh spam khi load trang
                hideLoader();
            }
        }

        window.handleGoogleLogin = async () => {
            showLoader();
            try {
                await signInWithPopup(auth, googleProvider);
                showToast("Đăng nhập thành công!", "success");
                window.location.hash = 'dashboard';
            } catch (e) {
                console.error("Google login error:", e);
                showToast(friendlyError(e), "error");
            }
            hideLoader();
        };

        window.handleLogout = async () => {
            if (!confirm("Bạn có chắc muốn đăng xuất?")) return;
            showLoader();
            try {
                await signOut(auth);
                await initAuth();
                window.location.hash = '';
                showToast("Đã đăng xuất", "info");
            } catch (e) {
                showToast(friendlyError(e), "error");
            }
            hideLoader();
        };

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            updateNavbar();
            if (user && !user.isAnonymous) await checkAndCacheUserBio();
            else userBioCache = null;
            handleRoute();
            hideLoader();
        });

        // ===== FIRESTORE =====
        async function checkAndCacheUserBio() {
            if (!currentUser || currentUser.isAnonymous) { userBioCache = null; return; }
            try {
                const q = query(collection(db, biosCollectionPath), where('ownerUid', '==', currentUser.uid));
                const snap = await getDocs(q);
                userBioCache = null;
                snap.forEach(d => { userBioCache = { id: d.id, ...d.data() }; });
            } catch (error) {
                console.warn("Query failed, fallback to full scan:", error);
                try {
                    const all = await getDocs(collection(db, biosCollectionPath));
                    userBioCache = null;
                    all.forEach(d => {
                        const data = d.data();
                        if (data.ownerUid === currentUser.uid) userBioCache = { id: d.id, ...data };
                    });
                } catch (e2) {
                    console.error("Fallback also failed:", e2);
                    showToast(friendlyError(e2), "error");
                }
            }
        }

        // ===== ROUTING =====
        function updateNavbar() {
            const navActions = document.getElementById('nav-actions');
            const isRealUser = currentUser && !currentUser.isAnonymous;
            if (isRealUser) {
                navActions.innerHTML = `
                    <button onclick="window.location.hash='dashboard'" class="text-gray-700 hover:text-blue-600 font-medium px-2 md:px-3 py-2 rounded-md transition-colors text-sm">
                        <i class="fa-solid fa-gauge-high md:hidden"></i>
                        <span class="hidden md:inline">Quản lý Bio</span>
                    </button>
                    <button onclick="handleLogout()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-3 md:px-4 rounded-full shadow-sm text-xs md:text-sm">
                        <i class="fa-solid fa-right-from-bracket md:hidden"></i>
                        <span class="hidden md:inline">Đăng xuất</span>
                    </button>`;
            } else {
                navActions.innerHTML = `
                    <button onclick="handleGoogleLogin()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-3 md:px-4 rounded-full shadow-md flex items-center text-xs md:text-sm">
                        <i class="fa-brands fa-google mr-0 md:mr-2"></i>
                        <span class="hidden md:inline">Đăng nhập</span>
                    </button>`;
            }
        }

        function handleRoute() {
            const hash = window.location.hash.substring(1);
            const main = document.getElementById('main-content');
            if (currentBioUnsubscribe) { currentBioUnsubscribe(); currentBioUnsubscribe = null; }
            document.body.className = "min-h-screen flex flex-col transition-colors duration-300 bg-gray-50";
            document.getElementById('navbar').style.display = 'block';
            document.title = 'MyBio - Tạo trang cá nhân của bạn';

            if (hash === '' || hash === '/') renderLandingPage(main);
            else if (hash === 'dashboard') {
                if (!currentUser || currentUser.isAnonymous) {
                    showToast("Vui lòng đăng nhập để quản lý Bio", "error");
                    window.location.hash = '';
                    return;
                }
                renderDashboard(main);
            } else renderBioPage(main, hash);
        }

        // ===== LANDING PAGE =====
        function renderLandingPage(container) {
            const isRealUser = currentUser && !currentUser.isAnonymous;
            container.innerHTML = `
                <div class="flex-grow relative overflow-hidden bg-white">
                    <div class="absolute top-0 left-0 w-72 md:w-96 h-72 md:h-96 bg-blue-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>
                    <div class="absolute top-20 right-0 w-72 md:w-96 h-72 md:h-96 bg-purple-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>
                    <div class="absolute -bottom-8 left-1/4 w-72 md:w-96 h-72 md:h-96 bg-pink-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>
                    <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 md:py-20">
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-16 items-center">
                            <div class="text-center lg:text-left animate-fade-in-up">
                                <div class="inline-flex items-center bg-blue-50 text-blue-700 px-3 py-1.5 rounded-full text-xs md:text-sm font-semibold mb-4 md:mb-6">
                                    <i class="fa-solid fa-bolt mr-2"></i> Miễn phí 100% • Không cần thẻ
                                </div>
                                <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold text-gray-900 tracking-tight mb-4 md:mb-6 leading-tight">
                                    Tạo Bio riêng của bạn <br class="hidden md:block">
                                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600">Thật Dễ Dàng.</span>
                                </h1>
                                <p class="text-base md:text-xl text-gray-600 mb-8 md:mb-10 max-w-xl mx-auto lg:mx-0 leading-relaxed">
                                    Gom tất cả liên kết, tệp tin và thông tin của bạn vào một trang duy nhất.
                                </p>
                                <div class="flex flex-col sm:flex-row gap-3 justify-center lg:justify-start mb-8">
                                    <button onclick="${isRealUser ? "window.location.hash='dashboard'" : "handleGoogleLogin()"}"
                                        class="bg-gray-900 hover:bg-gray-800 text-white font-bold py-3.5 md:py-4 px-8 md:px-10 rounded-full text-base md:text-lg shadow-xl hover:shadow-2xl transform hover:scale-105 transition-all active:scale-95">
                                        <i class="fa-solid fa-rocket mr-2"></i> Bắt đầu miễn phí
                                    </button>
                                </div>
                                <div class="flex items-center justify-center lg:justify-start space-x-6 text-xs md:text-sm text-gray-500">
                                    <div class="flex items-center"><i class="fa-solid fa-check-circle text-green-500 mr-2"></i> Không giới hạn</div>
                                    <div class="flex items-center"><i class="fa-solid fa-check-circle text-green-500 mr-2"></i> Nhanh chóng</div>
                                    <div class="flex items-center"><i class="fa-solid fa-check-circle text-green-500 mr-2"></i> Đẹp mắt</div>
                                </div>
                            </div>
                            <div class="hidden lg:flex justify-center animate-fade-in-up" style="animation-delay: 0.2s;">
                                <div class="relative">
                                    <div class="absolute -inset-8 bg-gradient-to-tr from-blue-400 to-purple-500 rounded-full blur-3xl opacity-30"></div>
                                    <div class="relative bg-gray-900 rounded-[3rem] p-3 shadow-2xl w-[320px] aspect-[9/19] border-8 border-gray-900 animate-float">
                                        <div class="absolute top-0 inset-x-0 h-7 bg-gray-900 rounded-b-2xl w-36 mx-auto z-20"></div>
                                        <div class="bg-gray-100 w-full h-full rounded-[2.5rem] overflow-hidden no-scrollbar p-5">
                                            <div class="text-center pt-8 pb-4">
                                                <div class="w-20 h-20 rounded-full bg-gradient-to-br from-blue-400 to-purple-500 mx-auto mb-3 flex items-center justify-center text-white text-2xl font-bold">A</div>
                                                <h3 class="font-bold text-gray-900">Nguyễn Văn A</h3>
                                                <p class="text-xs text-gray-500 mt-1">Developer • Hà Nội</p>
                                            </div>
                                            <div class="space-y-2">
                                                <div class="bg-white rounded-xl p-3 flex items-center shadow-sm">
                                                    <div class="w-10 h-10 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center"><i class="fa-brands fa-facebook"></i></div>
                                                    <div class="ml-3 flex-1"><p class="text-sm font-semibold">Facebook</p></div>
                                                    <i class="fa-solid fa-chevron-right text-gray-300 text-xs"></i>
                                                </div>

        window.handleClaimUsername = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('claim-btn');
            const username = document.getElementById('username-input').value.toLowerCase().trim();
            if (!/^[a-z0-9_-]{3,30}$/.test(username)) {
                showToast("Username không hợp lệ (3-30 ký tự a-z, 0-9, -, _)", "error");
                return;
            }
            setBtnLoading(btn, true);
            try {
                const docRef = doc(db, biosCollectionPath, username);
                const existing = await getDoc(docRef);
                if (existing.exists()) {
                    showToast("Tên bio này đã có người sử dụng!", "error");
                    setBtnLoading(btn, false);
                    return;
                }
                const newBio = {
                    ownerUid: currentUser.uid,
                    displayName: currentUser.displayName || "Người dùng mới",
                    bioText: "Chào mừng đến với trang của tôi!",
                    avatarUrl: "https://placehold.co/200x200/e2e8f0/475569?text=Avatar",
                    links: [], theme: "light", createdAt: new Date().toISOString()
                };
                await setDoc(docRef, newBio);
                showToast("Tạo Bio thành công!", "success");
                userBioCache = { id: username, ...newBio };
                renderDashboard(document.getElementById('main-content'));
            } catch (err) {
                console.error("Create bio error:", err);
                // ⚡ Hiện lỗi NGẮN GỌN, KHÔNG cắt
                showToast(friendlyError(err), "error");
                setBtnLoading(btn, false);
            }
        };

        // ===== EDITOR =====

                    if (id === 'bio-text') userBioCache.bioText = el.value;
                    updatePreviewArea();
                });

        window.openMobilePreview = () => {
            const modal = document.getElementById('mobile-preview-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            updatePreviewArea();
        };
        window.closeMobilePreview = () => {
            const modal = document.getElementById('mobile-preview-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        };
        window.handleAvatarSelect = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            try {
                const base64 = await compressImage(file, 200);
                document.getElementById('preview-avatar').src = base64;
                showLoader();
                await updateDoc(doc(db, biosCollectionPath, userBioCache.id), { avatarUrl: base64 });
                userBioCache.avatarUrl = base64;
                updatePreviewArea();
                showToast("Đã cập nhật avatar!", "success");
            } catch (err) { showToast(friendlyError(err), "error"); }
            hideLoader();
        };
        window.handleThumbnailSelect = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            try {
                const base64 = await compressImage(file, 150);
                const img = document.getElementById('item-thumbnail-preview');
                const icon = document.getElementById('item-thumbnail-icon');
                img.src = base64; img.classList.remove('hidden'); icon.classList.add('hidden');
                tempThumbnailBase64 = base64;
            } catch (err) { showToast(friendlyError(err), "error"); }
        };
        window.handleUpdateProfile = async (e) => {
            e.preventDefault();
            if (!userBioCache) return;
            const btn = document.getElementById('save-profile-btn');
            setBtnLoading(btn, true);
            try {
                const updates = {
                    displayName: document.getElementById('display-name').value.trim() || "Người dùng",
                    bioText: document.getElementById('bio-text').value.trim(),
                };
                await updateDoc(doc(db, biosCollectionPath, userBioCache.id), updates);
                userBioCache = { ...userBioCache, ...updates };
                showToast("Cập nhật hồ sơ thành công", "success");
            } catch (err) { showToast(friendlyError(err), "error"); }
            setBtnLoading(btn, false);
        };
        window.switchFormType = (type) => {
            document.getElementById('item-type').value = type;
            const btnLink = document.getElementById('btn-type-link');
            const btnFile = document.getElementById('btn-type-file');
            const extraFields = document.getElementById('file-extra-fields');
            if (type === 'link') {
                btnLink.className = "flex-1 py-2 rounded-lg text-xs md:text-sm font-medium bg-blue-100 text-blue-700 transition-colors";
                btnFile.className = "flex-1 py-2 rounded-lg text-xs md:text-sm font-medium bg-gray-100 text-gray-600 hover:bg-gray-200 transition-colors";
                extraFields.classList.add('hidden');
            } else {
                btnFile.className = "flex-1 py-2 rounded-lg text-xs md:text-sm font-medium bg-blue-100 text-blue-700 transition-colors";
                btnLink.className = "flex-1 py-2 rounded-lg text-xs md:text-sm font-medium bg-gray-100 text-gray-600 hover:bg-gray-200 transition-colors";
                extraFields.classList.remove('hidden');
            }
        };
        window.handleAddItem = async (e) => {
            e.preventDefault();
            if (!userBioCache) return;
            const btn = document.getElementById('add-item-btn');
            if ((userBioCache.links || []).length >= 20) { showToast("Giới hạn 20 liên kết.", "error"); return; }
            setBtnLoading(btn, true);
            try {
                const urlInput = document.getElementById('item-url').value.trim();
                try {
                    const u = new URL(urlInput);
                    if (!['http:','https:'].includes(u.protocol)) throw new Error();
                } catch {
                    showToast("URL không hợp lệ (phải bắt đầu http:// hoặc https://)", "error");
                    setBtnLoading(btn, false); return;
                }
                const newItem = {
                    id: Date.now().toString(),
                    type: document.getElementById('item-type').value,
                    title: document.getElementById('item-title').value.trim(),
                    url: urlInput,
                    thumbnail: tempThumbnailBase64 || null,
                    date: document.getElementById('item-date').value || null
                };
                const updatedLinks = [...(userBioCache.links || []), newItem];
                await updateDoc(doc(db, biosCollectionPath, userBioCache.id), { links: updatedLinks });
                userBioCache.links = updatedLinks;
                e.target.reset();
                tempThumbnailBase64 = null;
                document.getElementById('item-thumbnail-preview').classList.add('hidden');
                document.getElementById('item-thumbnail-icon').classList.remove('hidden');
                updatePreviewArea();
                showToast("Đã thêm!", "success");
            } catch (err) { showToast(friendlyError(err), "error"); }
            setBtnLoading(btn, false);
        };
        window.deleteItem = async (itemId) => {
            if (!userBioCache) return;
            if (!confirm("Bạn có chắc muốn xóa?")) return;
            showLoader();
            try {
                const updatedLinks = userBioCache.links.filter(l => l.id !== itemId);
                await updateDoc(doc(db, biosCollectionPath, userBioCache.id), { links: updatedLinks });
                userBioCache.links = updatedLinks;
                updatePreviewArea();
                showToast("Đã xóa", "success");
            } catch (err) { showToast(friendlyError(err), "error"); }
            hideLoader();
        };
        window.copyToClipboard = (text) => {
            try {
                const el = document.createElement('textarea');
                el.value = text; el.style.position = 'fixed'; el.style.opacity = '0';
                document.body.appendChild(el); el.select();
                document.execCommand('copy'); document.body.removeChild(el);
                showToast("Đã copy link Bio!", "success");
            } catch (e) { showToast("Không thể copy.", "error"); }
        };
        window.shareProfile = async (url) => {
            if (navigator.share) {
                try { await navigator.share({ title: 'MyBio', text: 'Xem trang của tôi!', url }); } catch (e) {}
            } else window.copyToClipboard(url);
        };

        function generateLinksHTML(links, isPreview = false) {
            if (!links || links.length === 0) {
                return `
                    <div class="text-center py-10 opacity-70">
                        <i class="fa-regular fa-folder-open text-4xl text-gray-400 mb-2"></i>
                        <p class="text-gray-500 font-medium text-sm">Danh sách trống</p>
                    </div>`;
            }
            return links.map(link => {
                const isFile = link.type === 'file';
                const safeLinkUrl = safeUrl(link.url);
                return `
                    <div class="relative group">
                        <a href="${escapeHtml(safeLinkUrl)}" target="_blank" rel="noopener noreferrer" class="block w-full mb-3 bg-white hover:bg-gray-50 border border-gray-200 rounded-2xl p-2 shadow-sm hover:shadow-md transition-all flex items-center">
                            ${link.thumbnail
                                ? `<img src="${escapeHtml(link.thumbnail)}" class="w-12 h-12 rounded-xl object-cover flex-shrink-0" alt="">`
                                : `<div class="w-12 h-12 rounded-xl bg-gray-100 flex items-center justify-center flex-shrink-0 text-gray-500"><i class="fa-solid ${isFile ? 'fa-file-lines' : 'fa-link'} text-lg"></i></div>`}
                            <div class="ml-3 flex-1 overflow-hidden">
                                <p class="text-gray-800 font-semibold truncate text-sm">${escapeHtml(link.title)}</p>
                                ${isFile && link.date ? `<p class="text-xs text-gray-500 mt-0.5"><i class="fa-regular fa-calendar-alt mr-1"></i> ${escapeHtml(new Date(link.date).toLocaleDateString('vi-VN'))}</p>` : ''}
                            </div>
                            <div class="px-2 text-gray-300"><i class="fa-solid fa-ellipsis-vertical"></i></div>
                        </a>
                        ${isPreview ? `<button onclick="deleteItem('${escapeHtml(link.id)}')" class="absolute -right-2 -top-2 w-7 h-7 bg-red-500 text-white rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity shadow-sm hover:bg-red-600 z-10" title="Xóa"><i class="fa-solid fa-xmark text-xs"></i></button>` : ''}
                    </div>`;
            }).join('');
        }
        function updatePreviewArea() {
            if (!userBioCache) return;
            const html = `
                <div class="px-4 pt-12 pb-6 text-center">
                    <img src="${escapeHtml(userBioCache.avatarUrl)}" class="w-20 h-20 rounded-full mx-auto object-cover border-2 border-white shadow-md mb-3" alt="">
                    <h2 class="text-lg font-bold text-gray-900">${escapeHtml(userBioCache.displayName)}</h2>
                    <p class="text-sm text-gray-600 mt-1 px-2 whitespace-pre-wrap">${escapeHtml(userBioCache.bioText)}</p>
                </div>
                <div class="px-4">${generateLinksHTML(userBioCache.links, true)}</div>

            const a = document.getElementById('editor-preview-area');
            const b = document.getElementById('mobile-preview-area');
            if (a) a.innerHTML = html;
            if (b) b.innerHTML = html;
        }

        // ===== PUBLIC BIO PAGE =====
        async function renderBioPage(container, username) {
            document.getElementById('navbar').style.display = 'none';
            document.body.className = "min-h-screen flex flex-col bg-animated text-gray-900";
            container.innerHTML = `
                <div class="flex-grow flex justify-center w-full">

                        <div id="bio-content-area" class="w-full">
                            <div class="flex justify-center items-center py-20"><div class="loader" style="border-top-color:#fff;"></div></div>
                        </div>
                        <div class="mt-auto pt-10 text-center">
                            <a href="#/" class="inline-block glass px-4 py-2 rounded-full shadow-sm hover:shadow-md transition-shadow">
                                <span class="text-xs font-semibold text-gray-700">Tạo bởi </span>
                                <span class="text-sm font-bold text-gray-900"><i class="fa-solid fa-link text-blue-600"></i> MyBio</span>
                            </a>
                        </div>
                    </div>
                </div>
            `;
            const contentArea = document.getElementById('bio-content-area');
            const docRef = doc(db, biosCollectionPath, username);

            currentBioUnsubscribe = onSnapshot(docRef, (docSnap) => {
                if (!docSnap.exists()) {
                    contentArea.innerHTML = `
                        <div class="glass rounded-2xl p-8 text-center mt-10 animate-fade-in">
                            <i class="fa-regular fa-face-frown text-5xl text-gray-500 mb-4"></i>
                            <h2 class="text-xl font-bold text-gray-800 mb-2">Trang không tồn tại</h2>

                            <a href="#/" class="bg-gray-900 text-white px-6 py-2.5 rounded-full font-medium hover:bg-gray-800 transition-colors inline-block">Tạo trang của bạn</a>
                        </div>`;
                    return;
                }
                const data = docSnap.data();
                const shareUrl = window.location.href;
                contentArea.innerHTML = `
                    <div class="text-center mb-8 animate-fade-in">
                        <img src="${escapeHtml(data.avatarUrl)}" class="w-24 h-24 rounded-full object-cover border-4 border-white/50 shadow-lg mx-auto mb-4" alt="">
                        <h1 class="text-2xl font-bold text-gray-900 drop-shadow-sm">${escapeHtml(data.displayName)}</h1>
                        ${data.bioText ? `<p class="text-gray-800 font-medium mt-2 px-4 whitespace-pre-wrap">${escapeHtml(data.bioText)}</p>` : ''}
                        <button onclick="shareProfile('${escapeHtml(shareUrl)}')" class="mt-4 inline-flex items-center bg-white/40 hover:bg-white/60 backdrop-blur-sm px-4 py-2 rounded-full text-sm font-semibold text-gray-800 transition-colors">
                            <i class="fa-solid fa-share-nodes mr-2"></i> Chia sẻ trang
                        </button>
                    </div>
                    <div class="space-y-3 animate-fade-in" style="animation-delay: 0.1s;">
                        ${generateLinksHTML(data.links, false)}
                    </div>`;
                document.title = `${data.displayName} | MyBio`;
            }, (error) => {
                console.error("Error listening:", error);
                contentArea.innerHTML = `
                    <div class="glass rounded-2xl p-6 text-center mt-10 animate-fade-in">
                        <i class="fa-solid fa-triangle-exclamation text-4xl text-amber-500 mb-3"></i>
                        <h2 class="text-lg font-bold text-gray-800 mb-2">Không tải được trang</h2>
                        <p class="text-gray-700 text-sm mb-4">${escapeHtml(friendlyError(error))}</p>
                        <button onclick="location.reload()" class="bg-gray-900 text-white px-5 py-2 rounded-full text-sm font-medium hover:bg-gray-800 transition-colors">
                            <i class="fa-solid fa-rotate-right mr-1"></i> Thử lại
                        </button>
                    </div>`;
            });
        }

        window.addEventListener('load', async () => { await initAuth(); });
        window.addEventListener('hashchange', handleRoute);
    </script>
</body>
</html>
